# YOLOv12 with Coordinate Attention (CoordAtt) Integration
# CoordAtt captures long-range dependencies with precise positional information
# Reference: https://arxiv.org/abs/2103.02907

# Parameters
nc: 5 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # summary: 272 layers, 2,602,288 parameters, 6.7 GFLOPs

# YOLO12n backbone with CoordAtt
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, CoordAtt, [256, 32]] # 3 - CoordAtt after C3k2 (inp, reduction)
  - [-1, 1, Conv, [256, 3, 2]] # 4-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 5
  - [-1, 1, CoordAtt, [512, 32]] # 6 - CoordAtt after C3k2
  - [-1, 1, Conv, [512, 3, 2]] # 7-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 8
  - [-1, 1, CoordAtt, [512, 32]] # 9 - CoordAtt after A2C2f
  - [-1, 1, Conv, [1024, 3, 2]] # 10-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 11
  - [-1, 1, CoordAtt, [1024, 32]] # 12 - CoordAtt after A2C2f

# YOLO12n head with CoordAtt
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 13 (Upsample từ P5 lên P4)
  - [[-1, 9], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 15
  - [-1, 1, CoordAtt, [512, 32]] # 16 - CoordAtt in head

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 17 (Upsample từ P4 lên P3)
  - [[-1, 6], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 19 (Đầu ra P3)
  - [-1, 1, CoordAtt, [256, 32]] # 20 - CoordAtt in head

  - [-1, 1, Conv, [256, 3, 2]] # 21 (Downsample từ P3 lên P4)
  - [[-1, 16], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 23 (Đầu ra P4)
  - [-1, 1, CoordAtt, [512, 32]] # 24 - CoordAtt in head

  - [-1, 1, Conv, [512, 3, 2]] # 25 (Downsample từ P4 lên P5)
  - [[-1, 12], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 27 (Đầu ra P5)
  - [-1, 1, CoordAtt, [1024, 32]] # 28 - CoordAtt in head

  - [[20, 24, 28], 1, Detect, [nc]] # 29 - Predict Head nhận (P3, P4, P5)
